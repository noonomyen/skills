services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relaybox
      POSTGRES_PASSWORD: relaybox
      POSTGRES_DB: relaybox
    ports:
      - "127.0.0.1:54332:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaybox -d relaybox"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:63792:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
